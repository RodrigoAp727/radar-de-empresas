name: Pipeline mensal

# Roda toda segunda-feira: se a Receita publicou uma pasta nova, processa e publica.
# Se não, o run.py detecta que a referência já foi publicada e termina em segundos.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      referencia:
        description: "Pasta AAAA-MM da Receita (vazio = mais recente)"
        required: false
      forcar:
        description: "Reprocessar mesmo se já publicada"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      novo: ${{ steps.run.outputs.novo }}
      referencia: ${{ steps.run.outputs.referencia }}
    steps:
      - uses: actions/checkout@v4

      # A base descompactada passa de 25 GB; liberamos espaço removendo SDKs que não usamos.
      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar pipeline
        id: run
        env:
          RADAR_MEMORY_LIMIT: 12GB
          RADAR_THREADS: "2"
        run: |
          python -m pipeline.run \
            ${{ inputs.referencia && format('--referencia {0}', inputs.referencia) || '' }} \
            ${{ inputs.forcar && '--forcar' || '' }}

      - name: Publicar camada gold no repositório
        if: steps.run.outputs.novo == 'true'
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold dashboard/sources/radar/radar_gold.duckdb
          git diff --cached --quiet || git commit -m "dados: referência ${{ steps.run.outputs.referencia }}"
          git push

      - name: Guardar documentação do dbt
        if: always() && steps.run.outputs.novo == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: |
            dbt/target/run_results.json
            dbt/target/manifest.json
          retention-days: 30

  dashboard:
    needs: pipeline
    if: needs.pipeline.outputs.novo == 'true'
    uses: ./.github/workflows/dashboard.yml
