radar:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('RADAR_DUCKDB', '../data/radar.duckdb') }}"
      threads: "{{ env_var('RADAR_THREADS', '4') | int }}"
      # Sem temp_directory aqui: o DuckDB usa <banco>.tmp/ ao lado do arquivo, e redefinir
      # a pasta em cada conexão do dbt falha depois que ela já recebeu dados da memória.
      settings:
        memory_limit: "{{ env_var('RADAR_MEMORY_LIMIT', '6GB') }}"
        preserve_insertion_order: false
